; ================================================================
; Linux Fleet Manager - Inventário padrão
;
; Ajuste conforme sua frota. Não armazene senhas em texto puro.
; Use SSH keys preferencialmente, ou ansible-vault para segredos.
; ================================================================

[all:vars]
; Variáveis comuns a todos os hosts Linux
; ansible_user = <seu-usuario-ssh>
; ansible_ssh_private_key_file = ~/.ssh/id_ed25519
ansible_port = 22
ansible_connection = ssh
ansible_host_key_checking = False
ansible_python_interpreter = /usr/bin/python3

; ================================================================
; Grupos de hosts
; ================================================================

[ubuntu]
ubuntu-01 ansible_host=192.168.1.10
ubuntu-02 ansible_host=192.168.1.11
localhost ansible_connection=local

[debian]
debian-01 ansible_host=192.168.1.20

[xubuntu]
; xubuntu-01 ansible_host=192.168.1.30

[linux:children]
ubuntu
debian
xubuntu
