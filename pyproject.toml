[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-fleet-manager"
version = "0.1.0"
description = "Linux Fleet Manager - Ferramenta profissional para gerenciamento e automação de frota de máquinas Linux"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LFM Team" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]
ansible = [
    "ansible>=2.16.0",
]

[project.scripts]
lfm = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "ansible*"]
exclude = ["tests*", "scripts*", "reports*", "logs*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
